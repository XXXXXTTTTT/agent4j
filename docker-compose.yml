name: agent4j

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent4j-postgres
    restart: unless-stopped
    # 自动加载 .env 文件中的变量
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent123456}
    # 暴露 5432 端口，方便本地使用 DBeaver / Navicat 连接数据库查看 Checkpoint 和向量表
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-agent} -d $${POSTGRES_DB:-agent}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - agent4j-postgres-data:/var/lib/postgresql/data

  agent-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent4j-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AGENT_WEB_PORT:-8080}:8080"
    # 使用 env_file 自动注入所有 AGENT_* 变量
    env_file:
      - .env
    # 仅对 Spring Boot 需要的数据库环境变量进行精准对齐与保底映射
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agent}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agent}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-agent123456}
      AGENT_PRODUCTION_ENABLED: ${AGENT_PRODUCTION_ENABLED:-true}
      AGENT_CODE_WORKSPACE: /agent-workspace
      AGENT_CODE_WORKSPACE_SOURCE_CONTAINER: agent4j-web
      AGENT_CODE_WORKSPACE_SOURCE_PATH: /agent-workspace
      AGENT_LOG_DIR: /app/logs
    volumes:
      # Agent 读取和修改的 Git 工作区；Docker-Java 仅向一次性沙箱转发这一条 bind。
      - type: bind
        source: ${AGENT_CODE_HOST_WORKSPACE:-.}
        target: /agent-workspace
      # 挂载宿主机 Docker Socket
      # 供 agent-sandbox 模块的 Docker-Java 在容器内部调度运行隔离的终端沙箱
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${AGENT_LOG_HOST_DIR:-./logs}
        target: /app/logs

volumes:
  agent4j-postgres-data:
    name: agent4j-postgres-data
