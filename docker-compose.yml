name: agent4j

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - agent4j-postgres-data:/var/lib/postgresql/data

  agent-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AGENT_WEB_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AGENT_SAMPLE_ENABLED: ${AGENT_SAMPLE_ENABLED}
      AGENT_LLM_ENABLED: ${AGENT_LLM_ENABLED}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY}
      AGENT_LLM_CHAT_COMPLETIONS_PATH: ${AGENT_LLM_CHAT_COMPLETIONS_PATH}
      AGENT_LLM_CODE_MODEL: ${AGENT_LLM_CODE_MODEL}
      AGENT_LLM_VISION_MODEL: ${AGENT_LLM_VISION_MODEL}
      AGENT_LLM_QUICK_CLASSIFICATION_MODEL: ${AGENT_LLM_QUICK_CLASSIFICATION_MODEL}
      AGENT_LLM_FALLBACK_MODEL: ${AGENT_LLM_FALLBACK_MODEL}
      AGENT_OBSERVABILITY_ENABLED: ${AGENT_OBSERVABILITY_ENABLED}
      AGENT_OBSERVABILITY_SERVICE_NAME: ${AGENT_OBSERVABILITY_SERVICE_NAME}
      AGENT_OBSERVABILITY_OTLP_TRACES_ENDPOINT: ${AGENT_OBSERVABILITY_OTLP_TRACES_ENDPOINT}
      AGENT_OBSERVABILITY_AUTHORIZATION: ${AGENT_OBSERVABILITY_AUTHORIZATION}
      AGENT_OBSERVABILITY_EXPORT_TIMEOUT: ${AGENT_OBSERVABILITY_EXPORT_TIMEOUT}

volumes:
  agent4j-postgres-data:
