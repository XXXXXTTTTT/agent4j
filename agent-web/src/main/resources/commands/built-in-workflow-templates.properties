plan=请制定可执行的实施计划：${request}
review=请审查当前工作区并处理请求：${request}
debug=请调试并定位根因：${request}。收集证据后实施最小修复并运行验证。
fix=请修复以下问题：${request}。先定位根因，再实施最小修复并运行聚焦验证。
test=请为以下请求编写或更新测试，并运行相关验证：${request}
explain=请只读解释以下内容，不修改文件：${request}
refactor=请重构以下内容，保持现有行为并运行相关测试：${request}
security-review=请执行安全审查：${request}。按风险等级给出证据和修复建议。
research=请在当前工作区执行只读研究：${request}。基于证据给出结论，不修改文件。
document=请为以下请求更新相关项目文档，并说明验证结果：${request}
implement=请实施以下明确需求：${request}。完成后运行针对性验证并汇报证据。
verify=请验证以下目标：${request}。只运行与目标相关的检查，并报告实际输出。
inspect=请只读检查当前工作区并分析：${request}。不要修改文件，结论必须引用实际证据。
architecture=请分析以下架构问题并提出可实施方案：${request}。说明影响范围、取舍和验证方式。
release=请执行发布前检查：${request}。检查构建、测试、配置和工作树状态，不跳过失败项。
tasks=请将以下请求拆解为有依赖关系的可执行任务清单：${request}。先核对当前工作区证据，再给出优先级、验收条件和下一步。
