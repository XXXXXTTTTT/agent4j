spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.group.readiness.include=readinessState,db
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
agent.logging.directory=${AGENT_LOG_DIR:logs}
agent.sample.enabled=${AGENT_SAMPLE_ENABLED:true}
agent.llm.enabled=${AGENT_LLM_ENABLED:false}
agent.llm.base-url=${AGENT_LLM_BASE_URL:}
agent.llm.api-key=${AGENT_LLM_API_KEY:}
agent.llm.chat-completions-path=${AGENT_LLM_CHAT_COMPLETIONS_PATH:/v1/chat/completions}
agent.llm.code-model=${AGENT_LLM_CODE_MODEL:}
agent.llm.vision-model=${AGENT_LLM_VISION_MODEL:}
agent.llm.quick-classification-model=${AGENT_LLM_QUICK_CLASSIFICATION_MODEL:}
agent.llm.fallback-model=${AGENT_LLM_FALLBACK_MODEL:}
agent.llm.max-concurrent-requests=${AGENT_LLM_MAX_CONCURRENT_REQUESTS:8}
agent.llm.max-requests-per-minute=${AGENT_LLM_MAX_REQUESTS_PER_MINUTE:120}
agent.llm.queue-timeout=${AGENT_LLM_QUEUE_TIMEOUT:2s}
agent.llm.code-capabilities=${AGENT_LLM_CODE_CAPABILITIES:CHAT_COMPLETIONS,STREAMING,TOOL_CALLING}
agent.llm.vision-capabilities=${AGENT_LLM_VISION_CAPABILITIES:CHAT_COMPLETIONS,STREAMING,VISION_INPUT}
agent.llm.quick-classification-capabilities=${AGENT_LLM_QUICK_CLASSIFICATION_CAPABILITIES:CHAT_COMPLETIONS,STREAMING}
agent.llm.fallback-capabilities=${AGENT_LLM_FALLBACK_CAPABILITIES:CHAT_COMPLETIONS}
agent.llm.circuit-breaker.failure-rate-threshold=${AGENT_LLM_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:100}
agent.llm.circuit-breaker.minimum-number-of-calls=${AGENT_LLM_CIRCUIT_BREAKER_MINIMUM_NUMBER_OF_CALLS:2}
agent.llm.circuit-breaker.sliding-window-size=${AGENT_LLM_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:2}
agent.llm.circuit-breaker.wait-duration-in-open-state=${AGENT_LLM_CIRCUIT_BREAKER_WAIT_DURATION_IN_OPEN_STATE:30s}
agent.llm.circuit-breaker.permitted-number-of-calls-in-half-open-state=${AGENT_LLM_CIRCUIT_BREAKER_PERMITTED_NUMBER_OF_CALLS_IN_HALF_OPEN_STATE:1}
agent.knowledge.enabled=${AGENT_KNOWLEDGE_ENABLED:true}
agent.knowledge.max-tokens=${AGENT_KNOWLEDGE_MAX_TOKENS:4000}
agent.rag.enabled=${AGENT_RAG_ENABLED:false}
agent.rag.embeddings-path=${AGENT_RAG_EMBEDDINGS_PATH:/v1/embeddings}
agent.rag.embedding-model=${AGENT_RAG_EMBEDDING_MODEL:}
agent.rag.rewrite-enabled=${AGENT_RAG_REWRITE_ENABLED:true}
agent.rag.hyde-enabled=${AGENT_RAG_HYDE_ENABLED:true}
agent.rag.strict=${AGENT_RAG_STRICT:false}
agent.rag.index-timeout=${AGENT_RAG_INDEX_TIMEOUT:5m}
agent.production.enabled=${AGENT_PRODUCTION_ENABLED:false}
agent.production.workspace=${AGENT_CODE_WORKSPACE:.}
agent.production.repository-id=${AGENT_CODE_REPOSITORY_ID:local}
agent.production.user-id=${AGENT_CODE_USER_ID:local}
agent.production.reviewer-url=${AGENT_CODE_REVIEWER_URL:}
agent.production.execution-mode=${AGENT_CODE_EXECUTION_MODE:DOCKER}
agent.production.bash-executable=${AGENT_CODE_BASH_EXECUTABLE:/bin/bash}
agent.production.docker-image=${AGENT_CODE_DOCKER_IMAGE:maven:3.9.9-eclipse-temurin-21}
agent.production.container-workspace=${AGENT_CODE_CONTAINER_WORKSPACE:/workspace}
agent.production.workspace-source-container=${AGENT_CODE_WORKSPACE_SOURCE_CONTAINER:}
agent.production.workspace-source-path=${AGENT_CODE_WORKSPACE_SOURCE_PATH:}
agent.production.command-timeout=${AGENT_CODE_COMMAND_TIMEOUT:10m}
agent.production.browser-timeout=${AGENT_CODE_BROWSER_TIMEOUT:30s}
agent.production.snapshot-max-files=${AGENT_CODE_SNAPSHOT_MAX_FILES:200}
agent.production.snapshot-max-bytes=${AGENT_CODE_SNAPSHOT_MAX_BYTES:524288}
agent.production.max-repair-attempts=${AGENT_CODE_MAX_REPAIR_ATTEMPTS:2}
agent.production.max-steps=${AGENT_CODE_MAX_STEPS:12}
agent.production.max-duration-ms=${AGENT_CODE_MAX_DURATION_MS:1800000}
agent.production.idle-timeout-ms=${AGENT_CODE_IDLE_TIMEOUT_MS:120000}
agent.production.token-budget=${AGENT_CODE_TOKEN_BUDGET:200000}
agent.production.no-progress-limit=${AGENT_CODE_NO_PROGRESS_LIMIT:3}
agent.production.planner-context-max-tokens=${AGENT_CODE_PLANNER_CONTEXT_MAX_TOKENS:12000}
agent.workspace-import.max-archive-bytes=${AGENT_WORKSPACE_IMPORT_MAX_ARCHIVE_BYTES:52428800}
agent.workspace-import.max-extracted-bytes=${AGENT_WORKSPACE_IMPORT_MAX_EXTRACTED_BYTES:104857600}
agent.workspace-import.max-files=${AGENT_WORKSPACE_IMPORT_MAX_FILES:5000}
agent.observability.enabled=${AGENT_OBSERVABILITY_ENABLED:false}
agent.observability.service-name=${AGENT_OBSERVABILITY_SERVICE_NAME:agent-runtime-system}
agent.observability.otlp-traces-endpoint=${AGENT_OBSERVABILITY_OTLP_TRACES_ENDPOINT:}
agent.observability.authorization=${AGENT_OBSERVABILITY_AUTHORIZATION:}
agent.observability.export-timeout=${AGENT_OBSERVABILITY_EXPORT_TIMEOUT:10s}
