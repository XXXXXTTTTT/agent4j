name: agent4j-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent4j-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent123456}
    ports:
      - "5432:5432"
    healthcheck:
      # pg_isready 只检查监听状态；psql 才能确认应用实际使用的账号和密码可登录。
      test: ["CMD-SHELL", "env PGPASSWORD=\"$${POSTGRES_PASSWORD:-agent123456}\" psql -h 127.0.0.1 -U \"$${POSTGRES_USER:-agent}\" -d \"$${POSTGRES_DB:-agent}\" -c 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - agent4j-postgres-data:/var/lib/postgresql/data

  agent-web:
    build:
      context: .
      # 显式指定使用本地的 Dockerfile.local
      dockerfile: Dockerfile.local
    container_name: agent4j-web-local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "${AGENT_WEB_PORT:-8080}:8080"
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 512
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agent}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agent}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-agent123456}
      # Compose 始终启动完整产品工作台，避免前端存在但工作区与会话接口未注册。
      AGENT_PRODUCTION_ENABLED: "true"
      AGENT_CODE_WORKSPACE: /agent-workspace
      AGENT_CODE_WORKSPACE_SOURCE_CONTAINER: agent4j-web-local
      AGENT_CODE_WORKSPACE_SOURCE_PATH: /agent-workspace
      AGENT_LOG_DIR: /app/logs
    volumes:
      - type: bind
        source: ${AGENT_CODE_HOST_WORKSPACE:-.}
        target: /agent-workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${AGENT_LOG_HOST_DIR:-./logs}
        target: /app/logs

volumes:
  agent4j-postgres-data:
